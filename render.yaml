# Render deployment config.
# This service uses a persistent Render Disk mounted at /data so the SQLite
# database survives restarts and redeploys. The DB_DIR env var points the app
# at that mount. NOTE: disks require a paid instance type (free tier has no
# persistent disk), hence plan: starter.
services:
  - type: web
    name: secret-santa-family
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    envVars:
      # Generated once by Render and kept stable so sessions survive restarts.
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Point the SQLite database at the persistent disk mount below.
      - key: DB_DIR
        value: /data
    disk:
      name: secret-santa-data
      mountPath: /data
      sizeGB: 1
