{% extends "base.html" %}
{% block content %}
<div class="login-card">
    <div class="login-icon">🎅</div>
    <h1>Secret Santa</h1>
    <p class="login-subtitle">Enter your username and password to see your assignment.</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Your username" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p style="margin-top:1rem;font-size:0.8rem;color:var(--text-muted);">
        Ask the admin for your login credentials.
    </p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    const btn = this.querySelector('button[type="submit"]');
    btn.textContent = 'Logging in...';
    btn.disabled = true;
});
</script>
{% endblock %}
